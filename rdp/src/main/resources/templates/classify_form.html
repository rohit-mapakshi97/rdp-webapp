<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RDP Classifier</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>RDP Classifier</h2>
    <form action="#" th:action="@{/classify}" th:object="${rdpform}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="sampleFile">Sample File:</label>
            <input type="file" th:field="*{files}" class="form-control-file" name="files" id="sampleFile" multiple>
        </div>

        <div class="form-group">
            <label for="conf">Confidence (Decimal in the range [0,1]):</label>
            <input type="number" th:field="*{conf}" class="form-control" name="conf" id="conf" step="0.01" min="0" max="1" value="0.8">
        </div>

        <div class="form-group">
            <label for="format">Output Format:</label>
            <select th:field="*{format}" class="form-control" name="format" id="format">
                <option value="allrank">All Rank</option>
                <option value="fixrank">Fix Rank</option>
                <option value="biom">BIOM</option>
                <option value="filterbyconf">Filter by Confidence</option>
                <option value="db">DB</option>
            </select>
        </div>

        <div class="form-group">
            <label for="gene">Gene:</label>
            <select th:field="*{gene}" class="form-control" name="gene" id="gene">
                <option value="16srrna">16S rRNA</option>
                <option value="fungallsu">Fungal LSU</option>
                <option value="fungalits_warcup">Fungal ITS (WARCUP)</option>
                <option value="fungalits_unite">Fungal ITS (UNITE)</option>
            </select>
        </div>

<!--        <div class="form-group">-->
<!--            <label for="outputFile">Output File:</label>-->
<!--            <input type="text" th:field="*{outputFile}" class="form-control" name="outputFile" id="outputFile">-->
<!--        </div>-->

<!--        </div>-->

<!--            <input type="text" th:field="*{bootstrapOutfile}" class="form-control" name="bootstrapOutfile" id="bootstrapOutfile">-->

<!--            <input type="text" th:field="*{trainPropfile}" class="form-control" name="trainPropfile" id="trainPropfile">-->
<!--        </div>-->

<!--            <input type="text" th:field="*{biomFile}" class="form-control" name="biomFile" id="biomFile">-->

<!--            <input type="text" th:field="*{metadata}" class="form-control" name="metadata" id="metadata">-->

<!--            <label for="shortseqOutfile">Short Sequence Output File:</label>-->
<!--            <input type="text" th:field="*{shortseqOutfile}" class="form-control" name="shortseqOutfile" id="shortseqOutfile">-->
<!--        </div>-->

        <div class="form-group">
            <label for="minWords">Minimum Words (Min = 5):</label>
            <input type="number" th:field="*{minWords}" class="form-control" name="minWords" id="minWords" value="5">
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
